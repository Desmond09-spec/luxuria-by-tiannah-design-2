    <script>
      // Progressive enhancement: gate entrance choreography on font readiness,
      // with a hard timeout so the page can never be left blank.
      document.documentElement.classList.add('js');
      var fontsReady = function () { document.documentElement.classList.add('fonts-ready'); };
      if (document.fonts && document.fonts.ready) { document.fonts.ready.then(fontsReady, fontsReady); }
      setTimeout(fontsReady, 1500);
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
